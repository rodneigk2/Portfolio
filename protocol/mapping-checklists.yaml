id: mapping_checklists
type: checklist
version: 0.9.0
minimal_map:
  use_for:
    - level_1
  fields:
    - objective
    - affected_area
    - candidate_files
    - risk
    - plan
    - validation
impact_map:
  use_for:
    - level_2
  fields:
    - real_objective
    - affected_flow
    - candidate_files
    - risks_and_side_effects
    - out_of_scope
    - change_plan
    - rollback_mental
    - expected_validation
critical_map:
  use_for:
    - level_3
  fields:
    - affected_data_or_environment
    - permissions
    - security_surface
    - critical_risks
    - safe_plan
    - required_confirmation
    - rollback_or_mitigation
rules:
  - id: MAP_001
    do_not_edit_file_unless: identified_as_candidate
  - id: MAP_002
    if_new_file_needed: update_map_before_editing

